name: Docker

# Builds on every pull request and publishes to Docker Hub
# (docker.io/polandy/restic-backup) only for a pushed vX.Y.Z tag, so the
# published tag names always match the git tags.
on:
  push:
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_NAME: docker.io/polandy/restic-backup

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Fails the run before anything is pushed if a tool the backup hooks rely
      # on is missing.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: restic-backup:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the amd64 image
        run: |
          docker run --rm --entrypoint sh restic-backup:smoke -c \
            'restic version && rclone version && sqlite3 --version && pg_dumpall --version && docker --version'

      # The entrypoint runs against a throwaway local repository and then
      # prints the crontab it wrote: the default must schedule the backup, an
      # empty BACKUP_CRON must not, and CHECK_CRON must work either way.
      - name: Test the BACKUP_CRON handling
        run: |
          # The entrypoint logs to stdout too, so only lines tagged CRON: count.
          run() {
            docker run --rm -e RESTIC_REPOSITORY=/tmp/repo -e RESTIC_PASSWORD=smoke "$@" \
              restic-backup:smoke sed 's/^/CRON: /' /var/spool/cron/crontabs/root | grep '^CRON: ' || true
          }
          run > default.txt
          run -e BACKUP_CRON= -e "CHECK_CRON=0 12 9 * *" > disabled.txt
          cat default.txt disabled.txt
          grep -q '^CRON: 0 \*/6 \* \* \* .*/bin/backup' default.txt
          # `! grep` would not trip bash -e, hence the explicit exit.
          if grep -q '/bin/backup' disabled.txt; then exit 1; fi
          grep -q '^CRON: 0 12 9 \* \* .*/bin/check' disabled.txt

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The git tag verbatim (v1.5.0), matching the existing Docker Hub tags.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

