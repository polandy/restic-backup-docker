name: Docker

# Builds on every pull request and publishes to Docker Hub
# (docker.io/polandy/restic-backup) only for a pushed vX.Y.Z tag, so the
# published tag names always match the git tags.
on:
  push:
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_NAME: docker.io/polandy/restic-backup

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Fails the run before anything is pushed if a tool the backup hooks rely
      # on is missing.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: restic-backup:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every test reports PASS/FAIL; the step fails if any of them does.
      # Covers the tools in the image, repository init (only for a missing
      # repository with RESTIC_INIT_REPO=true), the /bin/backup and /bin/check
      # exit statuses, the crontab, job logging to stdout and /bin/healthcheck.
      - name: Test the amd64 image
        run: tests/run.sh restic-backup:smoke

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The git tag verbatim (v1.5.0), matching the existing Docker Hub tags.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

